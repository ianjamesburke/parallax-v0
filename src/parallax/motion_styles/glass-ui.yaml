name: glass-ui
description: "Frosted translucent glassmorphism UI: dark gradient canvas, blurred glass panels, specular borders, soft ambient glows, and smooth eases."
design_rules: |
  Compose sleek iOS-inspired dark glassmorphic interfaces over a rich multi-stop gradient canvas with drifting radial ambient glow orbs.
  Construct cards and phone mockups with translucent fills (rgba(255, 255, 255, 0.12)), backdrop-filter blur(24px), 1.5px specular borders (rgba(255, 255, 255, 0.35)), and deep ambient glow shadows.
  Animate with silky smooth cubic/quartic eases, glowing SVG progress arcs, and gentle floating cards.
palette:
  bg: "#0D0A1A"
  surface: "#1E1538"
  ink: "#FFFFFF"
  accent: "#721CFF"
  accent2: "#01EDB8"
fonts:
  heading: "'Montserrat', 'Plus Jakarta Sans', 'DejaVu Sans', Arial, sans-serif"
  body: "'Inter', 'DejaVu Sans', Arial, sans-serif"
tokens:
  radius_card: "32px"
  radius_phone: "52px"
  radius_pill: "999px"
  border_card: "1.5px solid rgba(255, 255, 255, 0.35)"
  border_phone: "2px solid rgba(255, 255, 255, 0.38)"
  shadow_card: "0 20px 50px rgba(0, 0, 0, 0.36)"
  shadow_phone: "0 36px 90px rgba(0, 0, 0, 0.44)"
  glass_blur: "24px"
  surface_opacity: "0.18"
  headline_weight: "800"
  headline_case: "none"
  headline_letter_spacing: "-0.02em"
  bg_variant: "orb-glow"
  slot_gap: "34px"
  inner_gap: "26px"
  pad_card: "39px 46px"
  pad_phone: "42px 50px"
  pad_button: "32px 62px"
  pad_pill: "26px 50px"
  pad_stat: "35px 46px"
  pad_checklist: "32px 48px"
  pad_badge: "28px"
  pad_brand_plate: "18px 44px"
  force_dark_canvas: true
motion:
  eases:
    - "power4.out"
    - "power3.inOut"
    - "sine.inOut"
  durations:
    entrance: 0.50
    emphasis: 0.45
    settle: 0.40
  entrance_types:
    - "frosted-fade-up"
    - "glow-scale-in"
    - "arc-gauge-sweep"
    - "ambient-float"
do:
  - "Use frosted translucent panels with subtle white borders and vibrant neon/brand glow accents."
  - "Ensure all foreground typography is crisp white or high-luminance accent for legibility."
  - "Keep all cards and text within the safe box (x in [86, 994], y in [90, 1320])."
dont:
  - "Do not put dark text on dark translucent backgrounds."
  - "Do not use harsh black borders or jagged stepped animations."
  - "Do not place any UI text or logos in the caption zone below y=1344."
