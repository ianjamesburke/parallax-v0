<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: __PALETTE_BG__;
  --surface: __PALETTE_SURFACE__;
  --ink: __PALETTE_INK__;
  --accent: __PALETTE_ACCENT__;
  --accent2: __PALETTE_ACCENT2__;
  --on-surface: __PALETTE_ON_SURFACE__;
  --on-accent: __PALETTE_ON_ACCENT__;
  --on-accent2: __PALETTE_ON_ACCENT2__;
  --on-ink: __PALETTE_ON_INK__;
  --font-heading: __FONT_HEADING__;
  --font-body: __FONT_BODY__;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--ink);
}
#root {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: linear-gradient(160deg, var(--bg) 0%, var(--surface) 55%, var(--accent) 100%);
}
.brand-bar {
  position: absolute;
  left: 140px;
  top: 100px;
  width: 800px;
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#brand-logo {
  max-height: 60px;
  max-width: 240px;
  object-fit: contain;
  display: block;
}
.tag {
  position: absolute;
  left: 140px;
  top: 200px;
  width: 800px;
  padding: 18px 28px;
  background: rgba(255, 255, 255, 0.14);
  border: 2px solid rgba(255, 255, 255, 0.38);
  border-radius: 999px;
  backdrop-filter: blur(20px);
  color: var(--ink);
  font-family: var(--font-heading);
  font-size: 40px;
  font-weight: 800;
  text-align: center;
  overflow-wrap: anywhere;
}
.glass-panel {
  position: absolute;
  left: 180px;
  top: 330px;
  width: 720px;
  height: 740px;
  background: rgba(255, 255, 255, 0.12);
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-radius: 56px;
  backdrop-filter: blur(28px);
  box-shadow: 0 36px 90px rgba(0, 0, 0, 0.38);
  padding: 44px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}
.card {
  width: 600px;
  padding: 32px 28px;
  background: rgba(15, 23, 42, 0.72);
  border: 1.5px solid rgba(255, 255, 255, 0.28);
  border-radius: 32px;
  color: #ffffff;
  text-align: center;
}
.card-title {
  font-family: var(--font-heading);
  font-size: 40px;
  font-weight: 800;
  line-height: 1.18;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}
.card-sub {
  font-size: 26px;
  font-weight: 600;
  opacity: 0.9;
  overflow-wrap: anywhere;
}
.metric-pill {
  width: 600px;
  padding: 18px 24px;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.16);
  color: var(--ink);
  font-size: 28px;
  font-weight: 700;
  text-align: center;
}
.btn {
  position: absolute;
  left: 250px;
  top: 1125px;
  width: 580px;
  height: 112px;
  line-height: 112px;
  text-align: center;
  background: #ffffff;
  color: #0F172A;
  border-radius: 999px;
  font-family: var(--font-heading);
  font-size: 40px;
  font-weight: 800;
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.30);
}
</style>
<script>
/* __PARALLAX_GSAP_SCRIPT__ */
</script>
<script>
/* __PARALLAX_TIMING_BLOCK__ */
</script>
</head>
<body>
<div id="root" data-style="glass-ui">
  <div class="brand-bar">
    <img id="brand-logo" src="__BRAND_LOGO_DATA_URI__" alt="__BRAND_NAME__">
  </div>
  <div class="tag" id="tag">__SCENE_TAG__</div>
  <div class="glass-panel" id="panel">
    <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
      <circle cx="70" cy="70" r="54" stroke="rgba(255,255,255,0.22)" stroke-width="12"/>
      <circle id="ring" cx="70" cy="70" r="54" stroke="__PALETTE_ACCENT2__" stroke-width="12" stroke-dasharray="260 340" stroke-linecap="round"/>
    </svg>
    <div class="card" id="card">
      <div class="card-title">__SCENE_HEADLINE__</div>
      <div class="card-sub">__SCENE_SUB__</div>
    </div>
    <div class="metric-pill" id="metric">__BRAND_NAME__ LIVE ENGINE</div>
  </div>
  <div class="btn" id="btn">__SCENE_CTA__</div>
</div>
<script>
const dur = (window.__TIMING && window.__TIMING.duration) ? window.__TIMING.duration : 3.0;
const c1 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_1__", dur * 0.15) : dur * 0.15;
const c2 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_2__", dur * 0.48) : dur * 0.48;
if (window.__fitText) {
  window.__fitText("#tag", 720);
  window.__fitText(".card-title", 530);
  window.__fitText("#btn", 500);
}
const tl = gsap.timeline({paused:true});
tl.fromTo("#tag", {y: -16, opacity: 0.3}, {y: 0, opacity: 1, duration: 0.45, ease: "power4.out"}, 0)
  .fromTo("#panel", {scale: 0.92, y: 24}, {scale: 1, y: 0, duration: 0.50, ease: "power3.out"}, 0.05)
  .fromTo("#ring", {rotation: -90, transformOrigin: "50% 50%"}, {rotation: 45, duration: 0.65, ease: "power2.inOut"}, Math.min(c1, dur * 0.5))
  .fromTo("#card", {scale: 0.94}, {scale: 1, duration: 0.40, ease: "power3.out"}, Math.min(c1, dur * 0.5))
  .fromTo("#btn", {scale: 0.92, y: 18}, {scale: 1, y: 0, duration: 0.45, ease: "power4.out"}, Math.min(c2, dur * 0.72));
window.__seek = (t) => { tl.seek(t, false); };
window.__seek(0);
</script>
</body>
</html>
