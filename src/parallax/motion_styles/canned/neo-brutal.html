<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: __PALETTE_BG__;
  --surface: __PALETTE_SURFACE__;
  --ink: __PALETTE_INK__;
  --accent: __PALETTE_ACCENT__;
  --accent2: __PALETTE_ACCENT2__;
  --font-heading: __FONT_HEADING__;
  --font-body: __FONT_BODY__;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--ink);
}
#root {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: var(--bg);
}
.brand-bar {
  position: absolute;
  left: 120px;
  top: 96px;
  width: 840px;
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#brand-logo {
  max-height: 60px;
  max-width: 240px;
  object-fit: contain;
  display: block;
}
.tag {
  position: absolute;
  left: 120px;
  top: 195px;
  width: 840px;
  padding: 20px 30px;
  background: var(--accent2);
  border: 8px solid var(--ink);
  box-shadow: 12px 12px 0 var(--ink);
  font-family: var(--font-heading);
  font-size: 46px;
  font-weight: 900;
  color: var(--ink);
  text-align: center;
  transform: rotate(-1.5deg);
}
.phone {
  position: absolute;
  left: 200px;
  top: 340px;
  width: 680px;
  height: 730px;
  background: var(--surface);
  border: 10px solid var(--ink);
  border-radius: 40px;
  box-shadow: 20px 20px 0 var(--ink);
  padding: 40px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}
.card {
  width: 580px;
  padding: 32px 26px;
  background: var(--accent);
  color: #ffffff;
  border: 8px solid var(--ink);
  box-shadow: 12px 12px 0 var(--ink);
  text-align: center;
}
.card-title {
  font-family: var(--font-heading);
  font-size: 42px;
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: 12px;
  overflow-wrap: break-word;
}
.card-sub {
  font-size: 28px;
  font-weight: 700;
  overflow-wrap: break-word;
}
.stamp {
  width: 580px;
  padding: 18px 24px;
  background: var(--surface);
  border: 6px solid var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
  font-family: var(--font-heading);
  font-size: 32px;
  font-weight: 900;
  color: var(--ink);
  text-align: center;
}
.btn {
  position: absolute;
  left: 240px;
  top: 1125px;
  width: 600px;
  height: 116px;
  line-height: 100px;
  text-align: center;
  background: var(--surface);
  border: 8px solid var(--ink);
  box-shadow: 12px 12px 0 var(--ink);
  font-family: var(--font-heading);
  font-size: 42px;
  font-weight: 900;
  color: var(--ink);
}
</style>
<script>
/* __PARALLAX_GSAP_SCRIPT__ */
</script>
<script>
/* __PARALLAX_TIMING_BLOCK__ */
</script>
</head>
<body>
<div id="root" data-style="neo-brutal">
  <div class="brand-bar">
    <img id="brand-logo" src="__BRAND_LOGO_DATA_URI__" alt="__BRAND_NAME__">
  </div>
  <div class="tag" id="tag">__SCENE_TAG__</div>
  <div class="phone" id="phone">
    <svg width="110" height="110" viewBox="0 0 110 110" fill="none">
      <rect x="8" y="8" width="94" height="94" rx="18" fill="__PALETTE_ACCENT2__" stroke="__PALETTE_INK__" stroke-width="8"/>
      <path d="M34 56L50 72L78 40" stroke="__PALETTE_INK__" stroke-width="10" stroke-linecap="square"/>
    </svg>
    <div class="card" id="card">
      <div class="card-title">__SCENE_HEADLINE__</div>
      <div class="card-sub">__SCENE_SUB__</div>
    </div>
    <div class="stamp" id="stamp">__BRAND_NAME__ VERIFIED</div>
  </div>
  <div class="btn" id="btn">__SCENE_CTA__</div>
</div>
<script>
const dur = (window.__TIMING && window.__TIMING.duration) ? window.__TIMING.duration : 3.0;
const c1 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_1__", dur * 0.18) : dur * 0.18;
const c2 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_2__", dur * 0.50) : dur * 0.50;
const tl = gsap.timeline({paused:true});
tl.fromTo("#tag", {scale: 1.15, rotation: -4}, {scale: 1, rotation: -1.5, duration: 0.26, ease: "back.out(2.2)"}, 0)
  .fromTo("#phone", {y: 28}, {y: 0, duration: 0.28, ease: "steps(4)"}, 0.05)
  .fromTo("#card", {scale: 0.85, rotation: 2}, {scale: 1, rotation: 0, duration: 0.25, ease: "back.out(2.2)"}, Math.min(c1, dur * 0.5))
  .to("#card", {x: 8, duration: 0.06, yoyo: true, repeat: 3, ease: "none"}, Math.min(c1 + 0.26, dur * 0.65))
  .fromTo("#btn", {scale: 0.88, y: 20}, {scale: 1, y: 0, duration: 0.26, ease: "back.out(2.2)"}, Math.min(c2, dur * 0.72));
window.__seek = (t) => { tl.seek(t, false); };
window.__seek(0);
</script>
</body>
</html>
