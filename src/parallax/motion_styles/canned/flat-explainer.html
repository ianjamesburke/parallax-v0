<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: __PALETTE_BG__;
  --surface: __PALETTE_SURFACE__;
  --ink: __PALETTE_INK__;
  --accent: __PALETTE_ACCENT__;
  --accent2: __PALETTE_ACCENT2__;
  --font-heading: __FONT_HEADING__;
  --font-body: __FONT_BODY__;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--ink);
}
#root {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: radial-gradient(circle at 50% 32%, var(--surface) 0%, var(--bg) 78%);
}
.brand-header {
  position: absolute;
  left: 120px;
  top: 100px;
  width: 840px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
#brand-logo {
  max-height: 64px;
  max-width: 240px;
  object-fit: contain;
  display: block;
}
.tag {
  position: absolute;
  left: 140px;
  top: 205px;
  width: 800px;
  padding: 18px 28px;
  background: var(--accent);
  color: #ffffff;
  border-radius: 999px;
  font-family: var(--font-heading);
  font-size: 40px;
  font-weight: 800;
  text-align: center;
  box-shadow: 0 14px 34px rgba(10, 22, 40, 0.14);
}
.phone {
  position: absolute;
  left: 220px;
  top: 320px;
  width: 640px;
  height: 760px;
  background: var(--surface);
  border: 8px solid var(--ink);
  border-radius: 52px;
  box-shadow: 0 24px 60px rgba(10, 22, 40, 0.14);
  padding: 40px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}
.speaker {
  width: 140px;
  height: 14px;
  border-radius: 999px;
  background: rgba(10, 22, 40, 0.16);
}
.shield-wrap {
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 540px;
  padding: 28px 24px;
  background: var(--accent);
  color: #ffffff;
  border-radius: 28px;
  box-shadow: 0 16px 36px rgba(0, 89, 255, 0.24);
  text-align: center;
}
.card-title {
  font-family: var(--font-heading);
  font-size: 38px;
  font-weight: 800;
  line-height: 1.18;
  margin-bottom: 12px;
  overflow-wrap: break-word;
}
.card-sub {
  font-size: 26px;
  font-weight: 600;
  opacity: 0.92;
  overflow-wrap: break-word;
}
.status-row {
  width: 540px;
  padding: 16px 24px;
  background: rgba(0, 200, 83, 0.12);
  border-radius: 20px;
  color: var(--ink);
  font-size: 28px;
  font-weight: 700;
  text-align: center;
}
.btn {
  position: absolute;
  left: 260px;
  top: 1130px;
  width: 560px;
  height: 110px;
  line-height: 110px;
  text-align: center;
  background: var(--ink);
  color: #ffffff;
  border-radius: 999px;
  font-family: var(--font-heading);
  font-size: 40px;
  font-weight: 800;
  box-shadow: 0 16px 36px rgba(10, 22, 40, 0.20);
}
</style>
<script>
/* __PARALLAX_GSAP_SCRIPT__ */
</script>
<script>
/* __PARALLAX_TIMING_BLOCK__ */
</script>
</head>
<body>
<div id="root" data-style="flat-explainer">
  <div class="brand-header" id="brand-header">
    <img id="brand-logo" src="__BRAND_LOGO_DATA_URI__" alt="__BRAND_NAME__">
  </div>
  <div class="tag" id="tag">__SCENE_TAG__</div>
  <div class="phone" id="phone">
    <div class="speaker"></div>
    <div class="shield-wrap" id="shield">
      <svg width="130" height="130" viewBox="0 0 120 120" fill="none">
        <path d="M60 10L102 28V58C102 86 84 104 60 112C36 104 18 86 18 58V28L60 10Z" fill="__PALETTE_ACCENT__" opacity="0.16"/>
        <path d="M60 16L96 32V58C96 82 80 98 60 105C40 98 24 82 24 58V32L60 16Z" stroke="__PALETTE_ACCENT__" stroke-width="6"/>
        <path id="check-path" d="M43 60L55 72L79 46" stroke="__PALETTE_ACCENT2__" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="card" id="card">
      <div class="card-title">__SCENE_HEADLINE__</div>
      <div class="card-sub">__SCENE_SUB__</div>
    </div>
    <div class="status-row" id="status-row">PROTECTED BY __BRAND_NAME__</div>
  </div>
  <div class="btn" id="btn">__SCENE_CTA__</div>
</div>
<script>
const dur = (window.__TIMING && window.__TIMING.duration) ? window.__TIMING.duration : 3.0;
const c1 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_1__", dur * 0.15) : dur * 0.15;
const c2 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_2__", dur * 0.45) : dur * 0.45;
const tl = gsap.timeline({paused:true});
tl.fromTo("#tag", {scale: 0.85, opacity: 0.2}, {scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)"}, 0)
  .fromTo("#phone", {y: 30, opacity: 0.3}, {y: 0, opacity: 1, duration: 0.42, ease: "power3.out"}, 0.05)
  .fromTo("#card", {scale: 0.88}, {scale: 1.03, duration: 0.28, yoyo: true, repeat: 1, ease: "back.out(1.6)"}, Math.min(c1, dur * 0.5))
  .fromTo("#shield", {scale: 0.75, rotation: -8}, {scale: 1, rotation: 0, duration: 0.35, ease: "back.out(1.8)"}, Math.min(c1 + 0.1, dur * 0.6))
  .fromTo("#btn", {scale: 0.9, y: 18}, {scale: 1, y: 0, duration: 0.35, ease: "back.out(1.6)"}, Math.min(c2, dur * 0.7));
window.__seek = (t) => { tl.seek(t, false); };
window.__seek(0);
</script>
</body>
</html>
