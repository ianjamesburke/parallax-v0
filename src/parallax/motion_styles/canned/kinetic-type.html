<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: __PALETTE_BG__;
  --surface: __PALETTE_SURFACE__;
  --ink: __PALETTE_INK__;
  --accent: __PALETTE_ACCENT__;
  --accent2: __PALETTE_ACCENT2__;
  --font-heading: __FONT_HEADING__;
  --font-body: __FONT_BODY__;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--ink);
}
#root {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: var(--bg);
}
.kinetic-stage {
  position: absolute;
  left: 110px;
  top: 100px;
  width: 860px;
  height: 1160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 24px 20px;
}
.logo-row {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#brand-logo {
  max-height: 60px;
  max-width: 240px;
  object-fit: contain;
  display: block;
}
.word-pill {
  width: 800px;
  padding: 24px 32px;
  background: var(--accent);
  color: #ffffff;
  border-radius: 999px;
  font-family: var(--font-heading);
  font-size: 52px;
  font-weight: 900;
  text-align: center;
  letter-spacing: 0.02em;
  overflow-wrap: break-word;
}
.hero-type {
  width: 820px;
  padding: 40px 32px;
  background: var(--surface);
  border: 4px solid var(--accent);
  border-radius: 32px;
  text-align: center;
}
.hero-line1 {
  font-family: var(--font-heading);
  font-size: 56px;
  font-weight: 900;
  line-height: 1.14;
  color: var(--ink);
  margin-bottom: 18px;
  overflow-wrap: break-word;
}
.hero-line2 {
  font-size: 34px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--accent2);
  overflow-wrap: break-word;
}
.cta-block {
  width: 680px;
  padding: 26px 32px;
  background: var(--accent2);
  color: #ffffff;
  border-radius: 24px;
  font-family: var(--font-heading);
  font-size: 44px;
  font-weight: 900;
  text-align: center;
}
</style>
<script>
/* __PARALLAX_GSAP_SCRIPT__ */
</script>
<script>
/* __PARALLAX_TIMING_BLOCK__ */
</script>
</head>
<body>
<div id="root" data-style="kinetic-type">
  <div class="kinetic-stage">
    <div class="logo-row">
      <img id="brand-logo" src="__BRAND_LOGO_DATA_URI__" alt="__BRAND_NAME__">
    </div>
    <div class="word-pill" id="word1">__SCENE_TAG__</div>
    <div class="hero-type" id="word2">
      <div class="hero-line1">__SCENE_HEADLINE__</div>
      <div class="hero-line2">__SCENE_SUB__</div>
    </div>
    <div class="cta-block" id="word3">__SCENE_CTA__</div>
  </div>
</div>
<script>
const dur = (window.__TIMING && window.__TIMING.duration) ? window.__TIMING.duration : 3.0;
const c1 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_1__", dur * 0.15) : dur * 0.15;
const c2 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_2__", dur * 0.45) : dur * 0.45;
const tl = gsap.timeline({paused:true});
tl.fromTo("#word1", {scale: 0.8, y: -20}, {scale: 1, y: 0, duration: 0.25, ease: "back.out(1.8)"}, 0)
  .fromTo("#word2", {scale: 0.85, y: 24}, {scale: 1, y: 0, duration: 0.28, ease: "expo.out"}, Math.min(c1, dur * 0.45))
  .fromTo("#word3", {scale: 0.85, y: 20}, {scale: 1, y: 0, duration: 0.25, ease: "back.out(1.8)"}, Math.min(c2, dur * 0.72));
window.__seek = (t) => { tl.seek(t, false); };
window.__seek(0);
</script>
</body>
</html>
