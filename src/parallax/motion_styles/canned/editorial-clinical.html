<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: __PALETTE_BG__;
  --surface: __PALETTE_SURFACE__;
  --ink: __PALETTE_INK__;
  --accent: __PALETTE_ACCENT__;
  --accent2: __PALETTE_ACCENT2__;
  --font-heading: __FONT_HEADING__;
  --font-body: __FONT_BODY__;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--ink);
}
#root {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: var(--bg);
}
.editorial-frame {
  position: absolute;
  left: 110px;
  top: 100px;
  width: 860px;
  height: 1160px;
  background: var(--surface);
  border: 1.5px solid rgba(24, 24, 27, 0.16);
  border-radius: 20px;
  box-shadow: 0 12px 36px rgba(24, 24, 27, 0.05);
  padding: 48px 52px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1.5px solid rgba(24, 24, 27, 0.14);
  padding-bottom: 24px;
}
#brand-logo {
  max-height: 54px;
  max-width: 220px;
  object-fit: contain;
  display: block;
}
.kicker {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.headline-block {
  padding: 20px 0;
  border-bottom: 1.5px solid rgba(24, 24, 27, 0.14);
}
.headline {
  font-family: var(--font-heading);
  font-size: 54px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--ink);
  margin-bottom: 18px;
  overflow-wrap: break-word;
}
.subcopy {
  font-size: 30px;
  line-height: 1.35;
  color: var(--ink);
  opacity: 0.82;
  overflow-wrap: break-word;
}
.callout-box {
  padding: 28px 32px;
  background: var(--bg);
  border-left: 6px solid var(--accent);
  border-radius: 12px;
}
.callout-label {
  font-size: 24px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 10px;
}
.callout-val {
  font-family: var(--font-heading);
  font-size: 42px;
  font-weight: 700;
  color: var(--ink);
}
.cta-row {
  width: 100%;
  padding: 24px 32px;
  background: var(--accent);
  color: #ffffff;
  border-radius: 12px;
  font-size: 34px;
  font-weight: 700;
  text-align: center;
}
</style>
<script>
/* __PARALLAX_GSAP_SCRIPT__ */
</script>
<script>
/* __PARALLAX_TIMING_BLOCK__ */
</script>
</head>
<body>
<div id="root" data-style="editorial-clinical">
  <div class="editorial-frame" id="frame">
    <div class="top-row">
      <img id="brand-logo" src="__BRAND_LOGO_DATA_URI__" alt="__BRAND_NAME__">
      <div class="kicker" id="tag">__SCENE_TAG__</div>
    </div>
    <div class="headline-block" id="headline-block">
      <div class="headline" id="headline">__SCENE_HEADLINE__</div>
      <div class="subcopy" id="subcopy">__SCENE_SUB__</div>
    </div>
    <div class="callout-box" id="callout">
      <div class="callout-label">CLINICAL EVIDENCE · __BRAND_NAME__</div>
      <div class="callout-val">VERIFIED FORMULATION</div>
    </div>
    <div class="cta-row" id="btn">__SCENE_CTA__</div>
  </div>
</div>
<script>
const dur = (window.__TIMING && window.__TIMING.duration) ? window.__TIMING.duration : 3.0;
const c1 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_1__", dur * 0.15) : dur * 0.15;
const c2 = (window.__TIMING && window.__TIMING.cue) ? window.__TIMING.cue("__CUE_WORD_2__", dur * 0.45) : dur * 0.45;
const tl = gsap.timeline({paused:true});
tl.fromTo("#frame", {y: 20, opacity: 0.4}, {y: 0, opacity: 1, duration: 0.50, ease: "power3.out"}, 0)
  .fromTo("#headline-block", {y: 16}, {y: 0, duration: 0.45, ease: "power3.out"}, 0.08)
  .fromTo("#callout", {x: -18, opacity: 0.5}, {x: 0, opacity: 1, duration: 0.45, ease: "expo.out"}, Math.min(c1, dur * 0.5))
  .fromTo("#btn", {scale: 0.96}, {scale: 1, duration: 0.40, ease: "power2.out"}, Math.min(c2, dur * 0.72));
window.__seek = (t) => { tl.seek(t, false); };
window.__seek(0);
</script>
</body>
</html>
