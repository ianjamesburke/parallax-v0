name: editorial-clinical
description: "Editorial clinical authority: generous whitespace, serif/sans pairing, hairline Swiss grid rules, data callouts, and restrained trustworthy motion."
design_rules: |
  Design an authoritative, magazine-grade clinical or financial explainer on a warm alabaster or crisp ivory canvas.
  Pair high-contrast editorial serif headlines with clean sans-serif tabular numerals, separated by 1px hairline dividers (rgba(24, 24, 27, 0.15)).
  Present clear data callouts, milestone timelines, or ingredient/metric breakdowns with restrained, deliberate motion.
palette:
  bg: "#FAF7F2"
  surface: "#FFFFFF"
  ink: "#18181B"
  accent: "#2A5C43"
  accent2: "#C86D51"
fonts:
  heading: "Georgia, 'Instrument Serif', 'Times New Roman', serif"
  body: "'Inter', 'Montserrat', 'DejaVu Sans', Arial, sans-serif"
tokens:
  radius_card: "12px"
  radius_phone: "20px"
  radius_pill: "8px"
  border_card: "1.5px solid rgba(24, 24, 27, 0.16)"
  border_phone: "1.5px solid rgba(24, 24, 27, 0.22)"
  shadow_card: "0 8px 24px rgba(24, 24, 27, 0.05)"
  shadow_phone: "0 12px 36px rgba(24, 24, 27, 0.06)"
  glass_blur: "0px"
  surface_opacity: "1"
  headline_weight: "700"
  headline_case: "none"
  headline_letter_spacing: "-0.01em"
  bg_variant: "solid"
  slot_gap: "30px"
  inner_gap: "22px"
  pad_card: "34px 40px"
  pad_phone: "36px 44px"
  pad_button: "28px 54px"
  pad_pill: "22px 44px"
  pad_stat: "30px 40px"
  pad_checklist: "28px 42px"
  pad_badge: "24px"
  pad_brand_plate: "16px 38px"
  force_dark_canvas: false
motion:
  eases:
    - "power3.out"
    - "expo.out"
    - "power2.inOut"
  durations:
    entrance: 0.55
    emphasis: 0.45
    settle: 0.35
  entrance_types:
    - "masked-line-reveal"
    - "hairline-rule-grow"
    - "metric-fade-up"
    - "timeline-bar-fill"
do:
  - "Maintain generous breathing room, crisp 1px grid rules, and clear typographic hierarchy."
  - "Highlight one primary clinical metric or milestone beat synced to window.__TIMING.cue()."
  - "Keep all text strictly inside the safe box above y=1344 with zero text overlap."
dont:
  - "Do not use cartoonish bounces, neon glows, or rotated sticker tags."
  - "Do not crowd cards with long paragraphs; keep labels concise and scannable."
  - "Do not let serif headlines overflow horizontally (left < 70 or right > 1010)."
