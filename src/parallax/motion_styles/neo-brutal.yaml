name: neo-brutal
description: "Neo-brutalist pop punch: thick black borders, hard zero-blur offset shadows, saturated flat fills, chunky type, and snappy stepped motion."
design_rules: |
  Build high-impact neo-brutalist compositions with bold geometric blocks, thick solid ink borders (6px-10px solid #001A4D or #111111), and hard zero-blur offset shadows (12px 12px 0px #111111).
  Pair a warm or high-contrast pastel canvas with hyper-saturated flat fill cards, slightly tilted sticker tags (-3deg to +3deg), and heavy display typography.
  Choreograph entrances with snappy overshoot pops, stamp slams, and brief horizontal shake beats on emphasis words.
palette:
  bg: "#D4EEFF"
  surface: "#FFFFFF"
  ink: "#001A4D"
  accent: "#0059FF"
  accent2: "#FFDE3A"
fonts:
  heading: "'Anton', 'Montserrat', 'DejaVu Sans', Impact, sans-serif"
  body: "'Space Grotesk', 'DejaVu Sans', Arial, sans-serif"
tokens:
  radius_card: "12px"
  radius_phone: "36px"
  radius_pill: "12px"
  border_card: "6px solid var(--ink)"
  border_phone: "8px solid var(--ink)"
  shadow_card: "12px 12px 0px var(--ink)"
  shadow_phone: "16px 16px 0px var(--ink)"
  glass_blur: "0px"
  surface_opacity: "1"
  headline_weight: "900"
  headline_case: "uppercase"
  headline_letter_spacing: "0.01em"
  bg_variant: "solid"
  slot_gap: "36px"
  inner_gap: "28px"
  pad_card: "39px 46px"
  pad_phone: "42px 50px"
  pad_button: "32px 62px"
  pad_pill: "26px 50px"
  pad_stat: "35px 46px"
  pad_checklist: "32px 48px"
  pad_badge: "28px"
  pad_brand_plate: "18px 44px"
  force_dark_canvas: false
motion:
  eases:
    - "back.out(2.2)"
    - "steps(4)"
    - "expo.out"
  durations:
    entrance: 0.28
    emphasis: 0.22
    settle: 0.20
  entrance_types:
    - "stamp-slam"
    - "stepped-slide-up"
    - "sticker-tilt-pop"
    - "alert-shake"
do:
  - "Use 6px-10px solid dark borders and hard offset shadows (e.g. 14px 14px 0 #001A4D) with zero blur."
  - "Use chunky uppercase headlines and high-contrast sticker tags."
  - "Sync slam and shake beats to spoken emphasis words via window.__TIMING.cue()."
dont:
  - "Do not use soft blurred shadows, gradients, or low-contrast muted gray text."
  - "Do not place any text or badge in the bottom caption band (y > 1344)."
  - "Do not allow tilted stickers to clip outside the horizontal safe margins (x < 70 or x > 1010)."
