# Image generation models. All routed through OpenRouter's /api/v1/images endpoint.
#
# Tier aliases (`draft` / `mid` / `premium`) are the default vocabulary the
# agent uses. Named aliases exist for pinning a specific model.
# Slugs, costs and sizes were measured live on 2026-10-14: slugs against
# `/api/v1/images/models`, costs from the billed `usage.cost` of real 9:16
# calls (see DEV_LOG.md).
#
# DEFAULT RESOLUTION POLICY: every entry generates at the smallest output
# the model offers whose short side is at least 720 px (enough for 720x1280
# social video). It is set explicitly per entry in `request:`, the exact
# `quality` / `resolution` parameters sent to the API. `capabilities.native_size`
# is the measured 9:16 output (WxH). Models with no size control (gemini-2.5)
# return a fixed size. Below-720 tiers are never used (e.g. gemini 3.1 flash
# "512" returns 384x688).
#
# `cost` is the billed USD per image with NO reference images. Each reference
# image adds input-token cost (gpt-image: about +$0.0047 per ref at 432x768).
#
# `capabilities.aspect_ratios` is the list of Parallax aspects the model
# honors natively. `max_refs` is the model's `input_references` limit.

- alias: draft
  model_id: openrouter/openai/gpt-image-2.5-flare
  tier: draft
  cost: 0.00375
  unit: image
  description: Cheapest. OpenAI GPT Image 2.5 Flare at low quality. Honors 9:16 natively; strong identity with reference images.
  fallback: gemini-3-flash-lite
  request: {quality: low}
  capabilities:
    aspect_ratios: ["9:16", "16:9", "1:1", "4:3", "3:4"]
    native_size: "864x1536"
    max_refs: 16
  inputs:
    - style_ref
    - product_ref
    - character_ref

- alias: mid
  model_id: openrouter/openai/gpt-image-2.5-flare
  tier: mid
  cost: 0.00855
  unit: image
  description: Default. OpenAI GPT Image 2.5 Flare at medium quality. Cleaner detail and text than draft.
  fallback: gemini-3-flash-lite
  request: {quality: medium}
  capabilities:
    aspect_ratios: ["9:16", "16:9", "1:1", "4:3", "3:4"]
    native_size: "864x1536"
    max_refs: 16
  inputs:
    - style_ref
    - product_ref
    - character_ref

- alias: premium
  model_id: openrouter/openai/gpt-image-2.5-sunburst
  tier: premium
  cost: 0.0325
  unit: image
  description: Best fidelity. OpenAI GPT Image 2.5 Sunburst at high quality.
  fallback: null
  request: {quality: high}
  capabilities:
    aspect_ratios: ["9:16", "16:9", "1:1", "4:3", "3:4"]
    native_size: "864x1536"
    max_refs: 16
  inputs:
    - style_ref
    - product_ref
    - character_ref

