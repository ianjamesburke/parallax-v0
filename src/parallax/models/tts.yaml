# Text-to-speech models. Two backends are supported:
#   chat_audio: OpenAI gpt-audio-mini via /chat/completions audio modality
#   speech:     Gemini TTS via /audio/speech (supports inline [emotional] tags)
#
# Slugs verified live against OpenRouter /api/v1/models 2026-10-14. `cost` is USD per
# 1k input characters, measured on a 180-character script (billed usage.cost, or the
# /generation record for /audio/speech); real cost varies with how fast the voice speaks.
# `fixed_cost` is a flat USD per call. tts-mini's rate and fixed cost are a straight-line fit
# of three billed calls (180 chars $0.000674; 72 chars $0.000467 and $0.000451); short
# scripts cost more per character because the model also speaks extra words.

- alias: tts-mini
  model_id: openrouter/openai/gpt-audio-mini
  tts_backend: chat_audio
  tier: default
  cost: 0.00199
  fixed_cost: 0.0003
  unit: 1k_chars
  description: Default TTS. OpenAI gpt-audio-mini via OpenRouter (chat audio modality). Inline [emotional] tags are stripped before sending.
  fallback: null
  capabilities:
    aspect_ratios: []
  voices:
    - alloy
    - ash
    - ballad
    - coral
    - echo
    - fable
    - nova
    - onyx
    - sage
    - shimmer
    - verse

- alias: tts-gemini
  model_id: openrouter/google/gemini-3.1-flash-tts-preview
  tts_backend: speech
  tier: default
  cost: 0.0421
  unit: 1k_chars
  description: |
    Expressive TTS. Gemini 3.1 Flash TTS via OpenRouter (/audio/speech endpoint).
    Supports inline [emotional] tags for style control. Use single-word
    gerund/adjective/adverb form for best results — e.g. [dramatically],
    [whispering], [rapidly], [excitedly], [softly]. Tags are passed through
    to the model; use them anywhere in the voiceover text.

    Example:
      voice: Kore
      text: |
        [dramatically] Everything was about to change.
        [rapidly] Three seconds. Two. One.
        [softly] And then — silence.

    Dramatic voices: Kore (firm), Fenrir (excitable), Charon (informative), Puck (upbeat)
    Warm voices:    Aoede (breezy), Sulafat (warm), Achird (friendly), Sadaltager (knowledgeable)
    Soft voices:    Achernar (soft), Enceladus (breathy), Vindemiatrix (gentle)
  fallback: tts-mini
  capabilities:
    aspect_ratios: []
  voices:
    # Dramatic / assertive
    - Kore
    - Fenrir
    - Charon
    - Orus
    - Alnilam
    - Schedar
    # Upbeat / energetic
    - Puck
    - Laomedeia
    - Sadachbia
    - Leda
    - Autonoe
    # Breezy / warm / friendly
    - Aoede
    - Sulafat
    - Achird
    - Zephyr
    - Sadaltager
    - Zubenelgenubi
    # Smooth / easy-going
    - Algieba
    - Despina
    - Callirrhoe
    - Umbriel
    # Soft / breathy / gentle
    - Achernar
    - Enceladus
    - Vindemiatrix
    # Clear / informative
    - Iapetus
    - Erinome
    - Rasalgethi
    # Other
    - Algenib
    - Gacrux
    - Pulcherrima

